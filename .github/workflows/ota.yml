name: Manual DEV OTA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_API_BASE_URL_DEV: https://insurance-dev.up.railway.app
    steps:
      - name: Require dedicated DEV release branch
        run: test '${{ github.ref_name }}' = 'release/native-schedule-preferences-dev'
      - uses: actions/checkout@v4
        with:
          ref: dc039d350311935f2a70ac923cd45484b99e6b1c
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - name: Typecheck and Jest
        run: npm run typecheck && npm test -- --runInBand --forceExit
      - name: Verify DEV identity and runtime
        run: |
          npx expo config --json > /tmp/dev-config.json
          node <<'JS'
          const c = require('/tmp/dev-config.json');
          if(c.android.package !== 'com.onefc.app.dev' || c.version !== '1.0.0' || c.runtimeVersion.policy !== 'appVersion' || c.extra.eas.projectId !== '5e46e0bc-2885-4455-88ce-9ca1623df305') throw Error('DEV identity/runtime mismatch');
          console.log('DEV Android com.onefc.app.dev runtime 1.0.0 verified');
          JS
      - name: Publish Android DEV preview OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@16 update --channel native-preview --environment development --platform android --message 'PR #54: PC schedule visibility and Google auto-sync settings; DEV Android' --non-interactive --json > /tmp/dev-update.json
          node <<'JS'
          const raw = require('/tmp/dev-update.json');
          const updates = Array.isArray(raw) ? raw : [raw];
          for (const u of updates) console.log('DEV_OTA_RESULT ' + JSON.stringify({ id: u.id, group: u.group, platform: u.platform, runtimeVersion: u.runtimeVersion, branch: u.branch?.name, gitCommitHash: u.gitCommitHash }));
          JS
