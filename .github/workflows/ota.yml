name: Native Widget Layout Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  widget-tests:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_APP_ENV: development
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d592a574e125463edd1c9b0c82c10bd2dbac815b
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: npm ci
      - run: npm run typecheck && npm test -- --runInBand --forceExit
      - name: Prepare Android test project
        run: npx expo prebuild --platform android --no-install
      - name: Run RemoteViews layout and widget unit tests
        working-directory: android
        run: ./gradlew :onefc-home-widgets:testDebugUnitTest --no-daemon --stacktrace --tests expo.modules.onefchomewidgets.WidgetCalendarParityTest --tests expo.modules.onefchomewidgets.WidgetDatesTest --tests expo.modules.onefchomewidgets.WidgetTypographyTest --tests expo.modules.onefchomewidgets.WidgetDayNavTodayTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-unit-test-results
          path: |
            modules/onefc-home-widgets/android/build/test-results/
            modules/onefc-home-widgets/android/build/reports/tests/
