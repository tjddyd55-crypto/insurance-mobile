name: Manual Production Binder File OTA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_API_BASE_URL_PROD: https://insurance-production-7bd8.up.railway.app
    steps:
      - name: Require approved release branch
        run: test '${{ github.ref_name }}' = 'release/native-t722-binder-file-production'
      - uses: actions/checkout@v4
        with:
          ref: 224477b988cc5e395e1a8d232f783f1a455b48c4
          fetch-depth: 0
      - name: Verify approved commit (54b0773 last Production OTA + PR #58 cherry-pick)
        run: |
          test "$(git rev-parse HEAD)" = '224477b988cc5e395e1a8d232f783f1a455b48c4'
          test "$(git rev-parse HEAD~1)" = '54b077316e703f73b5e94094d08474c3eb0a2dd7'
          git fetch origin main
          git merge-base --is-ancestor 50b1fac4c3175cf323231c3770190afc375205f8 origin/main
          test "$(git show 50b1fac4c3175cf323231c3770190afc375205f8 | git patch-id --stable | cut -d' ' -f1)" = "$(git show HEAD | git patch-id --stable | cut -d' ' -f1)"
          test -z "$(git diff --name-only HEAD~1 HEAD | grep -v '^src/')"
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - name: Typecheck and Jest
        run: npm run typecheck && npm test -- --runInBand --forceExit
      - name: Verify Production identity and runtime 1.0.5
        run: |
          npx expo config --json > /tmp/production-config.json
          node <<'JS'
          const c = require('/tmp/production-config.json');
          if(c.android.package !== 'com.onefc.app' || c.version !== '1.0.5' || c.android.versionCode !== 15 || c.runtimeVersion.policy !== 'appVersion' || c.extra.eas.projectId !== '5e46e0bc-2885-4455-88ce-9ca1623df305') throw Error('Production identity/runtime mismatch');
          console.log('Production Android com.onefc.app runtime 1.0.5 versionCode 15 verified');
          JS
      - name: Publish Android Production OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@16 update --channel native-production --environment production --platform android --message 'PR #58 (Web #277): binder delete, My Files multi-select delete, display-name sync; Android runtime 1.0.5' --non-interactive --json > /tmp/production-update.json
          node <<'JS'
          const raw = require('/tmp/production-update.json');
          const updates = Array.isArray(raw) ? raw : [raw];
          for (const u of updates) {
            console.log('PRODUCTION_OTA_RESULT ' + JSON.stringify({ id: u.id, group: u.group, platform: u.platform, runtimeVersion: u.runtimeVersion, gitCommitHash: u.gitCommitHash }));
            if (u.platform !== 'android' || u.runtimeVersion !== '1.0.5' || u.gitCommitHash !== '224477b988cc5e395e1a8d232f783f1a455b48c4') throw Error('Published metadata mismatch');
          }
          JS
