name: Manual OTA

# push 로 실행하지 않는다. Actions 탭의 workflow_dispatch 만 허용한다.
# github.ref_name 이 release/ 로 시작하지 않으면 첫 단계에서 즉시 실패한다.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: EAS Update platform
        required: true
        type: choice
        default: all
        options:
          - android
          - ios
          - all
      message:
        description: EAS update message
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
    steps:
      - name: Require release branch
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_RELEASE_BRANCH: ${{ startsWith(github.ref_name, 'release/') }}
        run: |
          if [ "$IS_RELEASE_BRANCH" != "true" ]; then
            echo "::error::Manual OTA는 github.ref_name이 release/ 로 시작할 때만 실행할 수 있습니다. 현재 ref: $REF_NAME"
            exit 1
          fi
          echo "release 브랜치 확인: $REF_NAME"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      # 이 브랜치의 npm run check 는 기존 eslint 오류로 실패한다.
      # 발행 전 게이트는 통과 가능한 typecheck + Jest 로 둔다.
      - name: Typecheck and Jest
        run: npm run typecheck && npm test -- --runInBand
      - name: Verify runtime 1.0.4
        run: |
          npx expo config --json > /tmp/expo-config.json
          node scripts/otaWorkflow.mjs assert-runtime /tmp/expo-config.json
      - name: Publish production OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_PLATFORM: ${{ inputs.platform }}
          OTA_MESSAGE: ${{ inputs.message }}
        run: |
          set -o pipefail
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "secrets.EXPO_TOKEN 이 없습니다." >&2
            exit 1
          fi
          if [ -z "${OTA_MESSAGE}" ]; then
            echo "message 입력이 비어 있습니다." >&2
            exit 1
          fi
          case "${OTA_PLATFORM}" in
            android|ios|all) ;;
            *)
              echo "platform 은 android, ios, all 만 가능합니다." >&2
              exit 1
              ;;
          esac
          npx --yes eas-cli@16 update \
            --channel native-production \
            --environment production \
            --platform "${OTA_PLATFORM}" \
            --message "${OTA_MESSAGE}" \
            --non-interactive | tee /tmp/eas-update.txt
          node scripts/otaWorkflow.mjs group-id /tmp/eas-update.txt
