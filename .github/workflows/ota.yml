name: Manual Production Settings OTA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_API_BASE_URL_PROD: https://insurance-production-7bd8.up.railway.app
    steps:
      - name: Require approved release branch
        run: test '${{ github.ref_name }}' = 'release/native-schedule-settings-production'
      - uses: actions/checkout@v4
        with:
          ref: 54b077316e703f73b5e94094d08474c3eb0a2dd7
      - name: Verify approved main commit
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = '54b077316e703f73b5e94094d08474c3eb0a2dd7'
          test "$(git rev-parse origin/main)" = '54b077316e703f73b5e94094d08474c3eb0a2dd7'
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - name: Typecheck and Jest
        run: npm run typecheck && npm test -- --runInBand --forceExit
      - name: Verify Production identity and runtime 1.0.5
        run: |
          npx expo config --json > /tmp/production-config.json
          node <<'JS'
          const c = require('/tmp/production-config.json');
          if(c.android.package !== 'com.onefc.app' || c.version !== '1.0.5' || c.android.versionCode !== 15 || c.runtimeVersion.policy !== 'appVersion' || c.extra.eas.projectId !== '5e46e0bc-2885-4455-88ce-9ca1623df305') throw Error('Production identity/runtime mismatch');
          console.log('Production Android com.onefc.app runtime 1.0.5 versionCode 15 verified');
          JS
      - name: Publish Android Production OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@16 update --channel native-production --environment production --platform android --message 'PR #54 (Web #274): shared schedule and Google notification settings; Android runtime 1.0.5' --non-interactive --json > /tmp/production-update.json
          node <<'JS'
          const raw = require('/tmp/production-update.json');
          const updates = Array.isArray(raw) ? raw : [raw];
          for (const u of updates) {
            console.log('PRODUCTION_OTA_RESULT ' + JSON.stringify({ id: u.id, group: u.group, platform: u.platform, runtimeVersion: u.runtimeVersion, gitCommitHash: u.gitCommitHash }));
            if (u.platform !== 'android' || u.runtimeVersion !== '1.0.5' || u.gitCommitHash !== '54b077316e703f73b5e94094d08474c3eb0a2dd7') throw Error('Published metadata mismatch');
          }
          JS
