name: Manual OTA

on:
  workflow_dispatch:
    inputs:
      platform:
        description: EAS Update platform
        required: true
        type: choice
        default: android
        options:
          - android
      message:
        description: EAS update message (include PR)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      APPROVED_SOURCE_SHA: f993bfed6333bf119dec97d88d639e441950ecc5
    steps:
      - name: Require release branch and Android
        env:
          REF_NAME: ${{ github.ref_name }}
          OTA_PLATFORM: ${{ inputs.platform }}
        run: |
          case "$REF_NAME" in release/*) ;; *) exit 1 ;; esac
          test "$OTA_PLATFORM" = android
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SOURCE_SHA }}
      - name: Verify exact approved main commit
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_SOURCE_SHA"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "$APPROVED_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - name: Typecheck and Jest
        run: npm run typecheck && npm test -- --runInBand --forceExit
      - name: Verify unchanged Android runtime 1.0.5
        run: |
          npx expo config --json > /tmp/expo-config.json
          node <<'NODE'
          const c = require('/tmp/expo-config.json');
          const policy = c.android?.runtimeVersion ?? c.runtimeVersion;
          const runtime = typeof policy === 'string' ? policy : policy?.policy === 'appVersion' ? c.version : null;
          if (c.version !== '1.0.5' || runtime !== '1.0.5' || c.android?.package !== 'com.onefc.app' || c.android?.versionCode !== 15 || !c.updates?.enabled || c.extra?.eas?.projectId !== '5e46e0bc-2885-4455-88ce-9ca1623df305') throw new Error('Production identity/runtime gate failed');
          console.log(JSON.stringify({ version: c.version, runtime, platform: 'android', versionCode: c.android.versionCode }));
          NODE
      - name: Publish approved Android Production OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_MESSAGE: ${{ inputs.message }}
        run: |
          test -n "$EXPO_TOKEN"
          test -n "$OTA_MESSAGE"
          npx --yes eas-cli@16 update --channel native-production --environment production --platform android --message "$OTA_MESSAGE" --non-interactive --json > /tmp/ota-update.json
          node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/ota-update.json', 'utf8'));
          const updates = Array.isArray(raw) ? raw : raw.updates;
          if (!Array.isArray(updates) || updates.length !== 1) throw new Error('Expected one Android update');
          const u = updates[0];
          if (u.platform !== 'android' || u.runtimeVersion !== '1.0.5' || !u.id || !u.group) throw new Error('Published update identity mismatch');
          if (u.gitCommitHash && u.gitCommitHash !== process.env.APPROVED_SOURCE_SHA) throw new Error('Published source mismatch');
          const report = { updateId: u.id, groupId: u.group, platform: u.platform, runtimeVersion: u.runtimeVersion, channel: 'native-production', sourceCommitSha: process.env.APPROVED_SOURCE_SHA };
          fs.writeFileSync('/tmp/ota-safe-report.json', JSON.stringify(report, null, 2));
          console.log('OTA_RELEASE_REPORT=' + JSON.stringify(report));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Android Production OTA\n```json\n' + JSON.stringify(report, null, 2) + '\n```\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: native-month-calendar-ota-report
          path: /tmp/ota-safe-report.json
