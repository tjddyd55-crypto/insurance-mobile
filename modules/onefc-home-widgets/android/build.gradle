plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.onefchomewidgets'
version = '1.0.0'

android {
  namespace "expo.modules.onefchomewidgets"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  testOptions {
    unitTests.returnDefaultValues = true
    // 레이아웃 미리보기 테스트가 실제 res XML 을 읽게 한다.
    unitTests.includeAndroidResources = true
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // 이미 앱 의존성 그래프에 있는 버전(2.9.1)을 그대로 쓴다. 주기 갱신(15분 이상)·부팅 후 재예약.
  implementation 'androidx.work:work-runtime:2.9.1'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
  // EAS 없이 RemoteViews XML 을 샘플 데이터로 그려 PNG 를 만든다. 컴파일 SDK 36 은 아직 샌드박스가 없어 테스트는 @Config(sdk=34).
  testImplementation 'org.robolectric:robolectric:4.14.1'
  testImplementation 'androidx.test:core:1.6.1'
}
