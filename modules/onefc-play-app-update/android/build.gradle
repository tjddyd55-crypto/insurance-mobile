plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.onefcplayappupdate'
version = '1.0.0'

android {
  namespace "expo.modules.onefcplayappupdate"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Play In-App Updates (not the legacy monolithic play:core artifact).
  // Expo Modules API supports the New Architecture. No config plugin:
  // this library adds no permissions or manifest entries.
  implementation 'com.google.android.play:app-update:2.1.0'
}
